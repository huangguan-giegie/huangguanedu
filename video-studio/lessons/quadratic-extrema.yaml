title: 二次函数图像与最值
topic: 从抛物线的顶点看最值
grade: 九年级
targetDurationSeconds: 180
hook: 先别急着看答案：如果小球沿着这条抛物线滚下去，你猜它会停在什么位置？
cta: 如果你想把函数图像、配方法和中考题真正串起来，欢迎参加武汉中考数学系统课程。
question: 已知 y = x^2 - 4x + 3，求函数的最小值。
answer: 函数的最小值为 -1，取得时 x = 2。
solution: 将函数配方为 y = (x - 2)^2 - 1，因为 (x - 2)^2 >= 0，所以 y >= -1。
equationSteps:
  - "y = x² - 4x + 3"
  - "= x² - 4x + 4 - 4 + 3"
  - "= (x - 2)² - 1"
  - "因为 (x - 2)² ≥ 0"
  - "所以 y ≥ -1，x = 2 时取得最小值 -1"
